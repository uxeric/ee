[package]
name = "eoe"
version = "0.2.0"
edition = "2021"
description = "Eric's Own Editor: a keyboard-first plain-text editor for Omarchy with a cyberpunk look"

[[bin]]
name = "ee"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
tachyonfx = "0.25"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
toml = "1"
